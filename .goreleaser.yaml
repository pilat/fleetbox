version: 2

# Product release config: the pure-Go fleetbox CLI. No cgo, no codesign — the VM
# helper is a separate artifact published by release-helper.yml (ADR-0017).
builds:
  - id: fleetbox
    main: ./cmd/fleetbox
    binary: fleetbox
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      # Intel macOS is unsupported (Apple Virtualization needs Apple Silicon).
      - goos: darwin
        goarch: amd64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  draft: false

# Homebrew cask, regenerated and pushed to the pilat/homebrew-fleetbox tap on every v*
# release. GoReleaser deprecated `brews` (source-install formulae) in favour of casks for
# pre-built binaries; casks are macOS-only, which is fine here — Homebrew's audience is
# macOS, and Linux users install the CLI with `go install`. The cask carries only the
# pure-Go fleetbox binary; the signed helper and the cloud-hypervisor VMM still
# auto-download (checksum-pinned) on first boot, so there is nothing to codesign or build.
# The CLI is unsigned, so the post-install hook strips the macOS quarantine bit — without
# it Gatekeeper refuses to run a downloaded, unsigned binary. Needs CICD_HOMEBREW_GITHUB_TOKEN
# (a PAT with write access to the tap repo) in the release workflow env.
homebrew_casks:
  - name: fleetbox
    binaries:
      - fleetbox
    homepage: "https://github.com/pilat/fleetbox"
    description: "Linux VMs as Go test fixtures, on macOS and Linux behind one backend-neutral API"
    license: MIT
    commit_author:
      name: Vladimir Urushev
      email: vkurushev@gmail.com
    repository:
      owner: pilat
      name: homebrew-fleetbox
      token: "{{ .Env.CICD_HOMEBREW_GITHUB_TOKEN }}"
    url:
      verified: "github.com/pilat/fleetbox/"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fleetbox"]
          end
    caveats: |
      fleetbox boots real Linux VMs. The first `fleetbox up` downloads, checksum-pinned
      into ~/.fleetbox/, a small signed fleetbox-helper (macOS, Apple Silicon, 26+).
      Intel Macs are not supported.
