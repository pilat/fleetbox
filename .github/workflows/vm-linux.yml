name: VM boot (Linux)

# Proves the Linux backend end-to-end in CI, AND gives the inverted client↔helper
# protocol real-VM coverage (ADR-0020): x86-64 GitHub-hosted runners expose
# /dev/kvm, so the cloud-hypervisor backend can boot real VMs after a one-time
# udev tweak. It runs the full capability-driven suite (no -run selector) — so on top
# of the single-VM conformance check it now boots a multi-node cluster, giving amd64
# its first VM↔VM connectivity coverage; the nested orchestrator self-skips (it needs
# an M3+ macOS host). The test binary is its own helper — fleetbox.Start re-execs it with
# --fleetbox-runner and internal/holder's init() interceptor turns that child into
# the holder (real CH backend) — so this exercises the full client orchestrator →
# RPC → helper path, not just the backend. Bridge/tap creation needs CAP_NET_ADMIN,
# so the binary runs as root with the runner's HOME preserved (so ~/.fleetbox
# caching still applies). arm64 hosted runners have no KVM, so this is amd64 only.
#
# The conformance check is matrixed over the catalog (ADR-0030): a non-bootable
# catalog image (e.g. a firmware-only boot path choking on a modern initrd, ADR-0029)
# can no longer ship green behind debian-12. PR/push lanes boot a fixed 3-image subset
# (debian-12 baseline + the two newest kernels) to bound wait; a nightly schedule and
# manual dispatch boot the FULL catalog (FLEETBOX_TEST_IMAGES empty → all aliases).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

jobs:
  vm-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Enable KVM for the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Cache fleetbox downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.fleetbox/bin
            ~/.fleetbox/images
          key: fleetbox-linux-${{ hashFiles('**/go.sum') }}
          restore-keys: fleetbox-linux-

      # Hosted runners run Docker, which sets the iptables FORWARD policy to DROP when
      # it enables IP forwarding. fleetbox VMs forward through their own non-docker
      # bridge, so without this their egress is dropped — the same conflict libvirt KVM
      # and LXD hit on Docker hosts. fleetbox does not override the host firewall, so
      # allow the VM subnet range (192.168.0.0/16, where the backend hands out /24s)
      # through DOCKER-USER, which Docker evaluates before its DROP. Both directions:
      # guest egress (src) and the de-masqueraded return (dst). No-op without Docker.
      # (Egress is asserted over TCP, not ICMP — the runner network drops outbound ICMP.)
      - name: Allow VM egress past Docker's FORWARD DROP policy
        run: |
          if sudo iptables -L DOCKER-USER -n >/dev/null 2>&1; then
            sudo iptables -I DOCKER-USER -s 192.168.0.0/16 -j ACCEPT
            sudo iptables -I DOCKER-USER -d 192.168.0.0/16 -j ACCEPT
          fi

      # PR/push: a fixed 3-image subset bounds how long the lane waits on real boots.
      # schedule (nightly) and manual dispatch: an EMPTY value, which MatrixImages reads
      # as the FULL catalog (NOT "none" — see fleetboxtest.MatrixImages / ADR-0030).
      - name: Select catalog images
        run: |
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              echo "FLEETBOX_TEST_IMAGES=" >> "$GITHUB_ENV" ;;
            *)
              echo "FLEETBOX_TEST_IMAGES=debian-12,debian-13,ubuntu-26.04" >> "$GITHUB_ENV" ;;
          esac

      # sudo drops env vars not explicitly passed, so FLEETBOX_TEST_IMAGES is named in
      # the env list alongside HOME/PATH. The timeout clears the worst case: six serial
      # boots on the nightly run, each preceded by a first-run image download + qcow2→raw
      # convert of the four Ubuntu images.
      - name: Boot real VMs (catalog-matrix capability-driven suite)
        run: |
          go test -c -o /tmp/fleetboxtest ./fleetboxtest
          sudo -E env "HOME=$HOME" "PATH=$PATH" "FLEETBOX_TEST_IMAGES=$FLEETBOX_TEST_IMAGES" \
            /tmp/fleetboxtest -test.v -test.timeout 60m
