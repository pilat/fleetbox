name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint & Test
    # Must stay on macOS: CI builds and lints the darwin (VZ/cgo) code path. It
    # cannot boot VZ VMs (no nested virtualization on hosted runners), so VM-boot
    # tests are skipped here — they run via `make test-vm` on M3+/macOS 26+ locally.
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint (darwin)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Lint (linux)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
        env:
          GOOS: linux

      - name: Build (darwin, incl. signed VM helper)
        run: go build ./...

      - name: Cross-build (linux amd64 + arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...

      - name: Unit tests
        run: make test
