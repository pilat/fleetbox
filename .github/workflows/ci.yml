name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    name: macOS — Lint, Build & Test
    # Must stay on macOS: CI builds and lints the darwin (VZ/cgo) helper code path.
    # It cannot boot VZ VMs (no nested virtualization on hosted runners), so VM-boot
    # tests are skipped here — they run via `make test-vm` on M3+/macOS 26+ locally.
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint (darwin)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Lint (linux)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
        env:
          GOOS: linux

      # Lint the files behind the fleetbox_fake build tag (the fake backend, the
      # ssh-wait seam, the fake preflight, the tagged tests), invisible to the
      # default lint above — equivalent to `make lint-fake` (ADR-0018).
      - name: Lint (fake backend)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --build-tags fleetbox_fake

      - name: Build (darwin, incl. signed VM helper)
        run: go build ./...

      # Cross-build the Linux self-reexec path: the same binary links the
      # cloud-hypervisor backend + holder and becomes the helper after reexec
      # (ADR-0020). amd64 + arm64.
      - name: Cross-build (linux amd64 + arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...

      - name: Unit tests
        run: make test

      # Pre-merge gate for teardown + the holder protocol: the client drives a fake
      # helper over the real protocol (createnetwork/reserve/boot-member/status/stop)
      # with no VM boot and no codesign, so a regression fails the PR here rather than
      # slipping through (the VM-boot suites do not run on PRs). ADR-0018/0020.
      - name: Coordination tests (fake backend)
        run: make test-fake

  linux:
    name: Linux — Build & Coordination
    # Exercises the Linux client path: the self-reexec helper model and the fake
    # coordination over the real protocol. No KVM is needed here (the fake boots no
    # VM) — a real VM boot runs in vm-linux.yml on a KVM-enabled runner.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build (linux)
        run: go build ./...

      # Validate the release config (.goreleaser.yaml) on every PR, so a broken or
      # deprecated GoReleaser setting fails here instead of mid-release on a v* tag.
      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: Unit tests
        run: make test

      # The fake coordination via self-reexec: the test binary re-execs itself into
      # the fake holder (internal/holder init() interceptor), so the same protocol
      # gate runs on Linux without a separate helper binary, /dev/kvm, or root.
      - name: Coordination tests (fake backend, self-reexec)
        run: make test-fake-linux
